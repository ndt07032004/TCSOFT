<div class="auth-container">
    <div class="auth-card">
        <!-- Header -->
        <div class="text-center mb-8">
            <a routerLink="/" class="inline-flex items-center text-shopee-primary mb-4">
                <i class="fas fa-shopping-bag text-3xl mr-2"></i>
                <span class="text-2xl font-bold tracking-tight">HTTL SHOP</span>
            </a>
            <h1 class="text-2xl font-bold text-slate-800">Đặt lại mật khẩu</h1>
            <p class="text-slate-500 text-sm mt-2">Nhập mật khẩu mới của bạn</p>
        </div>

        <div *ngIf="successMessage" class="rounded-lg bg-green-50 p-4 mb-6 border border-green-100 flex">
            <i class="fas fa-check-circle text-green-500 mt-0.5 mr-3"></i>
            <div class="text-sm font-medium text-green-800">
                {{ successMessage }}
            </div>
        </div>

        <div *ngIf="error" class="rounded-lg bg-red-50 p-4 mb-6 border border-red-100 flex">
            <i class="fas fa-times-circle text-red-500 mt-0.5 mr-3"></i>
            <div class="text-sm font-medium text-red-800">
                {{ error }}
            </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <!-- New Password -->
            <div class="auth-input-group group">
                <input type="password" formControlName="newPassword" class="auth-input"
                    [ngClass]="{'error': submitted && f['newPassword'].errors}" placeholder="Mật khẩu mới">
                <div *ngIf="submitted && f['newPassword'].errors" class="auth-error-msg">
                    <div *ngIf="f['newPassword'].errors['required']">Vui lòng nhập mật khẩu mới</div>
                    <div *ngIf="f['newPassword'].errors['minlength']">Mật khẩu phải có ít nhất 6 ký tự</div>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="auth-input-group group">
                <input type="password" formControlName="confirmPassword" class="auth-input"
                    [ngClass]="{'error': submitted && f['confirmPassword'].errors}" placeholder="Nhập lại mật khẩu mới">
                <div *ngIf="submitted && f['confirmPassword'].errors" class="auth-error-msg">
                    <div *ngIf="f['confirmPassword'].errors['required']">Vui lòng nhập lại mật khẩu</div>
                    <div *ngIf="f['confirmPassword'].errors['mustMatch']">Mật khẩu không khớp</div>
                </div>
            </div>

            <button type="submit" [disabled]="loading" class="auth-btn">
                <i *ngIf="loading" class="fas fa-circle-notch fa-spin mr-2"></i>
                {{ loading ? 'Đang cập nhật...' : 'Đổi mật khẩu' }}
            </button>
        </form>

        <div class="mt-8 text-center text-sm">
            <a routerLink="/login" class="text-slate-500 hover:text-shopee-primary font-medium">
                Quay lại đăng nhập
            </a>
        </div>
    </div>
</div>
