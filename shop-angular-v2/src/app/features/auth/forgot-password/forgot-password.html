<div class="auth-container">
    <div class="auth-card">
        <!-- Header -->
        <div class="text-center mb-8">
            <a routerLink="/" class="inline-flex items-center text-shopee-primary mb-4">
                <i class="fas fa-shopping-bag text-3xl mr-2"></i>
                <span class="text-2xl font-bold tracking-tight">HTTL SHOP</span>
            </a>
            <h1 class="text-2xl font-bold text-slate-800">Đặt lại mật khẩu</h1>
            <p class="text-slate-500 text-sm mt-2">Chúng tôi sẽ gửi mã xác nhận đến email của bạn</p>
        </div>

        <div *ngIf="successMessage" class="rounded-lg bg-green-50 p-4 mb-6 border border-green-100 flex">
            <i class="fas fa-check-circle text-green-500 mt-0.5 mr-3"></i>
            <div class="text-sm font-medium text-green-800">
                {{ successMessage }}
            </div>
        </div>

        <div *ngIf="error" class="rounded-lg bg-red-50 p-4 mb-6 border border-red-100 flex">
            <i class="fas fa-times-circle text-red-500 mt-0.5 mr-3"></i>
            <div class="text-sm font-medium text-red-800">
                {{ error }}
            </div>
        </div>

        <!-- Step 1: Email Input -->
        <form *ngIf="step === 1" [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="auth-input-group group">
                <input id="email" type="email" formControlName="email" class="auth-input"
                    [ngClass]="{'error': submitted && f['email'].errors}" placeholder="Email của bạn">
                <div *ngIf="submitted && f['email'].errors" class="auth-error-msg">
                    <div *ngIf="f['email'].errors['required']">Vui lòng nhập email</div>
                    <div *ngIf="f['email'].errors['email']">Email không hợp lệ</div>
                </div>
            </div>

            <button type="submit" [disabled]="loading" class="auth-btn">
                <i *ngIf="loading" class="fas fa-circle-notch fa-spin mr-2"></i>
                {{ loading ? 'Đang gửi...' : 'Tiếp theo' }}
            </button>
        </form>

        <!-- Step 2: OTP Input -->
        <form *ngIf="step === 2" [formGroup]="otpForm" (ngSubmit)="onVerifyOtp()">
            <div class="text-center mb-6">
                <p class="text-sm text-slate-600">
                    Vui lòng nhập mã 6 số vừa được gửi đến email
                    <strong class="text-slate-800">{{ form.get('email')?.value }}</strong>
                </p>
            </div>

            <div class="auth-input-group group">
                <input id="otpCode" type="text" formControlName="otpCode"
                    class="auth-input text-center tracking-[0.5em] font-bold text-xl"
                    [ngClass]="{'error': otpSubmitted && o['otpCode'].errors}" placeholder="000000" maxlength="6">
                <div *ngIf="otpSubmitted && o['otpCode'].errors" class="auth-error-msg text-center">
                    <div *ngIf="o['otpCode'].errors['required']">Vui lòng nhập mã OTP</div>
                    <div *ngIf="o['otpCode'].errors['minlength']">Mã OTP phải có 6 ký tự</div>
                </div>
            </div>

            <button type="submit" [disabled]="loading" class="auth-btn">
                <i *ngIf="loading" class="fas fa-circle-notch fa-spin mr-2"></i>
                {{ loading ? 'Đang xác thực...' : 'Xác nhận' }}
            </button>

            <div class="text-center mt-6">
                <button type="button" (click)="step = 1; successMessage = ''; error = ''"
                    class="text-slate-500 hover:text-shopee-primary text-sm font-medium transition-colors">
                    <i class="fas fa-arrow-left mr-1"></i> Quay lại nhập email
                </button>
            </div>
        </form>

        <div class="mt-8 text-center text-sm">
            <a routerLink="/login" class="text-slate-500 hover:text-shopee-primary font-medium">
                Quay lại đăng nhập
            </a>
        </div>
    </div>
</div>
