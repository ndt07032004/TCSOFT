<div class="bg-slate-50 min-h-screen pb-10 pt-4">
    <div class="shopee-container flex">
        <!-- Sidebar (Reused) - Ideally should be a component -->
        <div class="w-[180px] shrink-0 mr-6">
            <div class="flex items-center space-x-3 mb-6 pl-2">
                <div
                    class="w-12 h-12 rounded-full bg-slate-200 border border-slate-300 flex items-center justify-center overflow-hidden">
                    <i class="fas fa-user text-2xl text-slate-400"></i>
                </div>
                <div>
                    <div class="font-bold text-sm truncate w-24">Tài khoản</div>
                    <a routerLink="/user/account/profile" class="text-xs text-slate-500 hover:text-shopee-primary"><i
                            class="fas fa-pen mr-1"></i>Sửa hồ sơ</a>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <div
                        class="flex items-center space-x-2 text-slate-800 font-medium mb-2 cursor-pointer hover:text-shopee-primary">
                        <a routerLink="/user/account/profile" class="flex items-center space-x-2 w-full">
                            <i class="fas fa-user text-blue-600 w-5 text-center"></i>
                            <span>Tài Khoản Của Tôi</span>
                        </a>
                    </div>
                </div>
                <div>
                    <div class="flex items-center space-x-2 text-shopee-primary font-medium cursor-pointer">
                        <i class="fas fa-clipboard-list text-blue-600 w-5 text-center"></i>
                        <span>Đơn Mua</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 min-h-[500px]">
            <!-- Tabs -->
            <div class="bg-white shadow-sm rounded-t-sm sticky top-0 z-10">
                <div class="flex overflow-x-auto">
                    <div *ngFor="let tab of tabs" (click)="activeStatus = tab.id"
                        [class.text-shopee-primary]="activeStatus === tab.id"
                        [class.border-shopee-primary]="activeStatus === tab.id"
                        [class.border-transparent]="activeStatus !== tab.id"
                        class="flex-1 text-center py-4 cursor-pointer hover:text-shopee-primary transition-colors border-b-2 font-medium text-sm whitespace-nowrap px-4">
                        {{ tab.name }}
                    </div>
                </div>
            </div>

            <!-- Order List -->
            <div class="space-y-4 mt-4">
                <!-- Search bar (Optional) -->
                <div class="bg-white p-4 shadow-sm rounded-sm">
                    <div class="bg-slate-100 flex items-center px-4 py-2 rounded-sm w-full">
                        <i class="fas fa-search text-slate-400 mr-2"></i>
                        <input type="text" placeholder="Tìm kiếm theo Tên Shop, ID Đơn hàng hoặc Tên Sản phẩm"
                            class="bg-transparent w-full text-sm outline-none">
                    </div>
                </div>

                <!-- Loading State -->
                <div *ngIf="loading" class="bg-white p-8 text-center shadow-sm rounded-sm">Đang tải đơn hàng...</div>

                <!-- Empty State -->
                <div *ngIf="!loading && filteredOrders.length === 0"
                    class="bg-white p-20 text-center shadow-sm rounded-sm flex flex-col items-center">
                    <div class="w-32 h-32 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-file-invoice text-5xl text-slate-300"></i>
                    </div>
                    <p class="text-slate-500 font-medium">Chưa có đơn hàng</p>
                </div>

                <!-- Order Items -->
                <div *ngFor="let order of filteredOrders" class="bg-white shadow-sm rounded-sm p-6">
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4 mb-4">
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-slate-800">HTTL MALL</span>
                        </div>
                        <div class="flex items-center space-x-4">
                            <span class="text-sm font-medium uppercase" [ngClass]="getStatusColor(order.status)">
                                {{ getStatusLabel(order.status) }}
                            </span>
                            <span *ngIf="order.status === 'DaGiao'"
                                class="text-shopee-primary text-sm uppercase px-2 border-l border-slate-200">ĐÁNH
                                GIÁ</span>
                        </div>
                    </div>

                    <!-- Assuming order.items is populated. If backend returns minimal order info, we might need to iterate items -->
                    <div *ngFor="let item of order.items"
                        class="flex space-x-4 mb-4 border-b border-slate-50 pb-4 last:border-0 last:pb-0">
                        <img [src]="item.productImage || 'assets/placeholder.png'"
                            class="w-20 h-20 object-cover border border-slate-200"
                            onerror="this.src='assets/placeholder.png'">
                        <div class="flex-1">
                            <h3 class="text-slate-800 text-sm mb-1 line-clamp-2">{{ item.productName }}</h3>
                            <p class="text-slate-500 text-xs">Phân loại hàng: Mặc định</p>
                            <div class="text-xs text-slate-800 mt-1">x{{ item.quantity }}</div>
                        </div>
                        <div class="text-right">
                            <!-- Example price handling -->
                            <span class="text-shopee-primary text-sm font-medium">₫{{ item.price | number }}</span>
                        </div>
                    </div>

                    <div
                        class="border-t border-slate-100 pt-6 flex justify-end items-center space-x-4 bg-yellow-50/10 -mx-6 -mb-6 px-6 py-4 mt-0">
                        <div class="text-sm">Thành tiền: <span class="text-xl text-shopee-primary font-medium">₫{{
                                order.totalPrice | number }}</span></div>
                    </div>

                    <div class="flex justify-end space-x-4 mt-4 pt-4">
                        <ng-container *ngIf="order.status === 'ChoXacNhan' || order.status === 'CHOXACNHAN'">
                            <button (click)="cancelOrder(order.idDH)"
                                class="shopee-button bg-red-500 hover:bg-red-600 text-white min-w-[150px]">Huỷ
                                Đơn</button>
                        </ng-container>
                        <ng-container *ngIf="order.status !== 'ChoXacNhan' && order.status !== 'CHOXACNHAN'">
                            <button (click)="buyAgain(order.idDH)"
                                class="shopee-button bg-shopee-primary text-white min-w-[150px]">Mua Lại</button>
                        </ng-container>
                        <button [routerLink]="['/user/purchase/order', order.idDH]"
                            class="border border-slate-300 text-slate-600 px-6 py-2 rounded-sm hover:bg-slate-50 text-sm">Xem
                            Chi Tiết</button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
