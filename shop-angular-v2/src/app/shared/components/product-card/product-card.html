<div class="shopee-card h-full flex flex-col group relative transition-shopee">
    <!-- Image Area with Mall Badge -->
    <div class="relative aspect-square overflow-hidden bg-slate-50">
        <img [src]="getImageUrl(product.imageUrl)" [alt]="product.name"
            class="w-full h-full object-cover group-hover:opacity-90 transition-opacity">

        <!-- Shopee Mall style label -->
        <div class="absolute top-0 left-0">
            <div class="shopee-badge-mall px-1.5 py-0.5">Mall</div>
        </div>

        <!-- Discount / Stock Overlay -->
        <div *ngIf="product.stockQuantity < 5" class="absolute bottom-0 left-0 w-full bg-shopee-orange px-2 py-0.5">
            <p class="text-[10px] text-white font-bold uppercase text-center">Low Stock</p>
        </div>
    </div>

    <!-- Info Area -->
    <div class="p-3 flex-1 flex flex-col">
        <!-- Title -->
        <h3 class="text-[12px] leading-relaxed text-slate-800 line-clamp-2 cursor-pointer mb-2 min-h-[2.5rem] group-hover:text-shopee-primary transition-colors"
            [routerLink]="['/products', product.idSP]">
            {{ product.name }}
        </h3>

        <!-- Product Attributes -->
        <div class="flex items-center space-x-2 mb-3">
            <div class="flex items-center">
                <ng-container *ngFor="let star of getStarArray(product.averageRating)">
                    <i class="fas fa-star text-[10px]"
                        [ngClass]="star <= product.averageRating ? 'text-yellow-400' : 'text-slate-200'"></i>
                </ng-container>
            </div>
            <span class="text-[10px] text-slate-400 font-medium px-1.5 py-0.5 bg-slate-50 rounded-sm">{{ product.size
                }}</span>
            <span class="text-[10px] text-slate-400 font-medium px-1.5 py-0.5 bg-slate-50 rounded-sm">{{
                getColorLabel(product.color)
                }}</span>
        </div>

        <!-- Pricing & Action Row -->
        <div class="mt-auto flex items-center justify-between">
            <div class="flex flex-col">
                <div class="flex items-baseline space-x-1">
                    <span class="text-[10px] text-shopee-primary font-medium">₫</span>
                    <span class="text-base text-shopee-primary font-medium">{{ product.price | number:'1.0-0' }}</span>
                </div>
            </div>

            <button (click)="addToCart()"
                [ngClass]="isInCart ? 'bg-shopee-primary text-white border-shopee-primary' : 'bg-slate-50 text-slate-400 hover:text-shopee-primary hover:bg-shopee-primary/10 border-slate-100'"
                class="w-7 h-7 rounded-full transition-colors flex items-center justify-center border">
                <i class="fas fa-cart-plus text-[12px]"></i>
            </button>
        </div>
    </div>
</div>
