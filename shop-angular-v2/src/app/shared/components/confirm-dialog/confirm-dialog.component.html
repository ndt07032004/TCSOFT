<div *ngIf="state.show"
    class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-scale-in">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
            <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest">{{ state.title || 'Xác nhận' }}</h3>
            <button (click)="onCancel()" class="text-slate-400 hover:text-slate-600 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Body -->
        <div class="p-6">
            <p class="text-slate-600 font-medium text-sm leading-relaxed">{{ state.message }}</p>
        </div>

        <!-- Footer -->
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
            <button (click)="onCancel()"
                class="px-4 py-2 bg-white border border-slate-200 text-slate-500 hover:text-slate-700 hover:bg-slate-50 rounded-lg text-xs font-bold uppercase tracking-wider transition-all shadow-sm">
                {{ state.noText || 'Hủy' }}
            </button>
            <button (click)="onConfirm()"
                class="px-4 py-2 bg-slate-900 text-white hover:bg-slate-800 rounded-lg text-xs font-bold uppercase tracking-wider transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5">
                {{ state.yesText || 'Đồng ý' }}
            </button>
        </div>
    </div>
</div>
